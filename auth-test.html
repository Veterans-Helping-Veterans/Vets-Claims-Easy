<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.firebaseio.com https://firebasestorage.googleapis.com https://*.googleapis.com https://identitytoolkit.googleapis.com;">
    <title>Firebase Authentication Test</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8">Firebase Authentication Test</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Authentication Status</h2>
            <p>Current status: <span id="authStatus" class="text-red-600 font-bold">Not Authenticated</span></p>
        </div>
        
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Login Form -->
            <div id="loginForm" class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Login</h2>
                <form>
                    <div class="mb-4">
                        <label for="loginEmail" class="block text-gray-700 mb-2">Email</label>
                        <input type="email" id="loginEmail" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <div class="mb-4">
                        <label for="loginPassword" class="block text-gray-700 mb-2">Password</label>
                        <input type="password" id="loginPassword" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Login</button>
                    <p id="loginStatus" class="mt-3"></p>
                </form>
            </div>
            
            <!-- Create Account Form -->
            <div id="createAccountForm" class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Create Account</h2>
                <form>
                    <div class="mb-4">
                        <label for="createEmail" class="block text-gray-700 mb-2">Email</label>
                        <input type="email" id="createEmail" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <div class="mb-4">
                        <label for="createPassword" class="block text-gray-700 mb-2">Password</label>
                        <input type="password" id="createPassword" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="block text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Create Account</button>
                    <p id="createStatus" class="mt-3"></p>
                </form>
            </div>
        </div>
        
        <!-- Logout Button -->
        <div class="mt-6 text-center">
            <button id="logoutButton" class="hidden bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">Logout</button>
        </div>
        
        <!-- User Info -->
        <div id="userInfo" class="mt-6"></div>
        
        <!-- Back to Tests -->
        <div class="mt-8 text-center">
            <a href="firebase-test.html" class="text-blue-600 hover:underline">← Back to Firebase Tests</a>
        </div>
    </div>
    
    <!-- Firebase Scripts -->
    <script type="module" src="js/firebase-auth-test.js"></script>
</body>
</html>
