<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Veterans Claims Assistance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100">
    <div id="loginContainer" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <div class="text-center mb-6">
                <img src="/Vets-Claims-Easy/images/company-logo.png" alt="Veterans Claims Logo" class="w-32 h-32 mx-auto mb-2">
                <h2 class="text-2xl font-bold text-center text-green-800">Admin Login</h2>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="adminEmail" class="block text-gray-700 font-bold mb-2">Email</label>
                    <input type="email" id="adminEmail" name="adminEmail" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label for="adminPassword" class="block text-gray-700 font-bold mb-2">Password</label>
                    <input type="password" id="adminPassword" name="adminPassword" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div class="flex justify-center">
                    <button type="submit" class="bg-green-700 hover:bg-green-800 text-white font-bold py-2 px-6 rounded">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="adminDashboard" class="hidden">
        <header class="bg-green-800 text-white p-4">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">Admin Dashboard</h1>
                <button id="logoutBtn" class="bg-red-700 hover:bg-red-800 text-white font-bold py-1 px-4 rounded">
                    Logout
                </button>
            </div>
        </header>

        <main class="container mx-auto p-4">
            <section class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h2 class="text-2xl font-bold mb-4 text-green-800">Claim Requests</h2>

                <div class="mb-4 flex flex-wrap gap-2">
                    <button class="filter-btn bg-green-600 text-white px-3 py-1 rounded" data-filter="all">All</button>
                    <button class="filter-btn bg-gray-300 text-gray-800 px-3 py-1 rounded" data-filter="new">New</button>
                    <button class="filter-btn bg-gray-300 text-gray-800 px-3 py-1 rounded" data-filter="in-progress">In Progress</button>
                    <button class="filter-btn bg-gray-300 text-gray-800 px-3 py-1 rounded" data-filter="completed">Completed</button>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="py-2 px-4 border-b text-left">Date</th>
                                <th class="py-2 px-4 border-b text-left">Name</th>
                                <th class="py-2 px-4 border-b text-left">Claim Type</th>
                                <th class="py-2 px-4 border-b text-left">Status</th>
                                <th class="py-2 px-4 border-b text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="claimsTableBody">
                            <!-- Claims will be populated here by JavaScript -->
                            <tr>
                                <td colspan="5" class="py-4 text-center text-gray-500">No claims found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Claim Details Modal -->
        <div id="claimModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-lg w-full max-w-4xl max-h-screen overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-green-800">Claim Details</h3>
                        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <div id="claimDetails" class="space-y-4">
                        <!-- Claim details will be populated here by JavaScript -->
                    </div>

                    <div class="mt-6 border-t pt-4">
                        <h4 class="font-bold mb-2">Update Status</h4>
                        <div class="flex space-x-2">
                            <select id="statusUpdate" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
                                <option value="new">New</option>
                                <option value="in-progress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                            <button id="updateStatusBtn" class="bg-green-700 hover:bg-green-800 text-white font-bold py-2 px-4 rounded">
                                Update
                            </button>
                        </div>
                    </div>

                    <div class="mt-4 border-t pt-4">
                        <h4 class="font-bold mb-2">Add Note</h4>
                        <textarea id="adminNote" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600"
                            placeholder="Add a note about this claim..."></textarea>
                        <div class="mt-2 flex justify-end">
                            <button id="addNoteBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Add Note
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
